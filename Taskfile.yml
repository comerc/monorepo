version: "3"

tasks:
  default:
    # Эта задача выполняется по умолчанию при вызове 'task' без аргументов.
    # Она скрыта из списка, так как у нее нет 'desc'.
    cmds:
      - task --list
      - echo "task <name> --summary"
    silent: true

  sync:
    desc: "Sync go.mod and go work"
    cmds:
      - ./scripts/eval-all.sh "go mod download && go mod tidy"
      - go work sync

  mock:
    desc: "Regenerate mocks"
    cmd: ./scripts/eval-all.sh "go run github.com/vektra/mockery/v3@latest"

  proto:
    desc: "Regenerate backend gRPC contracts"
    cmd: >-
      protoc --go_out=. --go-grpc_out=.
      --go_opt=paths=source_relative
      --go-grpc_opt=paths=source_relative
      backend/auth/pkg/grpc/auth.proto
      backend/user/pkg/grpc/user.proto
      backend/profile/pkg/grpc/profile.proto

  gateway-compose:
    desc: "Compose Cosmo router execution config"
    dir: backend/gateway
    cmd: npx wgc router compose -i router-compose.yaml -o router.json

  up:
    desc: "Run local docker compose stack"
    cmds:
      - task gateway-compose
      - docker compose up -d --build

  down:
    desc: "Stop local docker compose stack"
    cmd: docker compose down

  lint:
    desc: "Run linters"
    cmds:
      - |
        ROOT="$(pwd)"
        ./scripts/eval-all.sh "bash '$ROOT/scripts/lint.sh'"

  test-clean:
    desc: "Clean testcache"
    cmd: go clean -testcache

  test-short:
    desc: "Run short tests"
    cmd: ./scripts/eval-all.sh "go test -p 8 -race -failfast -short ./..."

  test-smoke:
    desc: "Run smoke tests"
    cmds:
      - |
        ./scripts/eval.sh "go test -timeout 20m -v -failfast -tags smoke ./test/smoke/"

  test-bdd:
    desc: "Run BDD scenarios"
    cmds:
      - |
        ./scripts/eval.sh "go test -timeout 20m -v -failfast -tags bdd ./backend/test/bdd/"

  bdd-out:
    desc: "Show pending and undefined BDD steps"
    env:
      BDD_GODOG_FORMAT: events
    cmds:
      - |
        go test -timeout 20m -v -tags bdd ./backend/test/bdd/ 2>&1 | jq -Rr \
          'fromjson? | select(.event == "TestStepFinished" and (.status == "pending" or .status == "undefined")) | [.status, .location] | @tsv' > backend/test/bdd-out.txt

  bdd-inventory:
    desc: "Group pending and undefined BDD steps by epic"
    cmd: python3 ./scripts/bdd_inventory.py "backend/test/bdd-out.txt" > backend/test/bdd-inventory.md

  kill-port:
    desc: "Kill specific port"
    summary: |
      Kill specific port.

      EXAMPLE:
        task kill-port -- 7171
    cmds:
      - lsof -ti:{{.CLI_ARGS}} | xargs kill -9
