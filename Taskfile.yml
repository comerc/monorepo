version: "3"

tasks:
  default:
    # Эта задача выполняется по умолчанию при вызове 'task' без аргументов.
    # Она скрыта из списка, так как у нее нет 'desc'.
    cmds:
      - task --list
      - echo "task <name> --summary"
    silent: true

  sync:
    desc: "Sync go.mod and go work"
    cmds:
      - ./scripts/eval-all.sh "go mod download && go mod tidy"
      - go work sync

  mock:
    desc: "Regenerate mocks"
    cmd: ./scripts/eval-all.sh "go run github.com/vektra/mockery/v3@latest"

  lint:
    desc: "Run linters"
    cmds:
      - |
        ROOT="$(pwd)"
        ./scripts/eval-all.sh "bash '$ROOT/scripts/lint.sh'"

  unit:
    desc: "Run unit tests"
    cmd: ./scripts/eval-all.sh "go test -p 8 -race -failfast ./..."

  smoke:
    desc: "Run smoke tests"
    cmds:
      - |
        ./scripts/eval.sh "go test -timeout 20m -p 1 -v -failfast -tags smoke ./test/smoke/"

  bdd:
    desc: "Run BDD scenarios"
    cmds:
      - |
        ./scripts/eval.sh "go test -timeout 20m -p 1 -v -failfast -tags bdd ./test/bdd/suite/"

  bdd-out:
    desc: "Show pending and undefined BDD steps"
    env:
      BDD_GODOG_FORMAT: events
    cmds:
      - |
        go test -timeout 20m -p 1 -v -tags bdd ./test/bdd/... 2>&1 | jq -Rr \
          'fromjson? | select(.event == "TestStepFinished" and (.status == "pending" or .status == "undefined")) | [.status, .location] | @tsv' > test/bdd-out.txt

  bdd-inventory:
    desc: "Group pending and undefined BDD steps by epic"
    cmd: python3 ./scripts/bdd_inventory.py "bdd-out.txt" > test/bdd-inventory.md

  test-clean:
    desc: "Clean testcache"
    cmd: go clean -testcache
