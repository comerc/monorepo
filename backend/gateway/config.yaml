# yaml-language-server: $schema=https://raw.githubusercontent.com/wundergraph/cosmo/main/router/pkg/config/config.schema.json
version: "1"

listen_addr: "0.0.0.0:3002"
playground:
  enabled: true
introspection:
  enabled: true
log_level: "info"

execution_config:
  file:
    path: "/config/router.json"
    watch: false

authentication:
  jwt:
    jwks:
      - secret: "${AUTH_JWT_SECRET}"
        header_key_id: "auth"
        symmetric_algorithm: HS256
    header_name: Authorization
    header_value_prefix: Bearer

headers:
  all:
    request:
      - op: "propagate"
        named: Authorization
      - op: "set"
        name: "X-User-ID"
        expression: "request.auth.isAuthenticated ? request.auth.claims.sub : ''"
