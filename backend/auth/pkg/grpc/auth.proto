syntax = "proto3";

package auth.v1;

option go_package = "github.com/pure-golang/monorepo/backend/auth/pkg/grpc;authpb";

service AuthService {
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);
}

message ValidateTokenRequest {
  string token = 1;
}

message ValidateTokenResponse {
  string user_id = 1;
  string email = 2;
  string token_id = 3;
}
