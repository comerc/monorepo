include:
  - path: ./backend/docker-compose.yml

services:
  postgres:
    image: postgres:16-alpine
    container_name: monorepo-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-monorepo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-monorepo}
      POSTGRES_DB: ${POSTGRES_DB:-monorepo}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-monorepo} -d ${POSTGRES_DB:-monorepo}" ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - monorepo-network

  redis:
    image: redis:7-alpine
    container_name: monorepo-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - monorepo-network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: monorepo-rabbitmq
    entrypoint:
      - sh
      - -c
      - >-
        chown -R rabbitmq:rabbitmq /var/lib/rabbitmq &&
        chmod 700 /var/lib/rabbitmq &&
        exec docker-entrypoint.sh rabbitmq-server
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity" ]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s
    networks:
      - monorepo-network

  mailpit:
    image: axllent/mailpit:latest
    container_name: monorepo-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8025/api/v1/info" ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - monorepo-network

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:

networks:
  monorepo-network:
    name: monorepo-network
    driver: bridge
